<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    body {
      background-color: #0f172a; /* dark blue */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    .card {
      background-color: #1e293b; 
      color: white;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      width: 300px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .card img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .info {
      flex-grow: 1;
    }

    .info h3 {
      margin: 0;
      font-size: 18px;
    }

    .info p {
      margin: 4px 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      background-color: #2563eb;
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .refresh-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .refresh-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="users">

  </div>

  <button class="refresh-btn">🔄 Refresh</button>

  <script src="script.js"></script>
</body>
</html>
